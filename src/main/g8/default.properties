description= A standard template for Scala 3 project with clean Architecture

name = My Template
organization = io.github.khanr1
package =$organization;format="lower,package"$


# maven(org,artifact,stable) resolves the newest release carrying no version
# qualifier. The artifact must be the published Maven artifactId including its
# suffix: giter8 does no %%/%%% inference, so use cats-core_3, laminar_sjs1_3,
# and name_2.12_1.0 for sbt plugins. A property that fails to resolve aborts
# the whole generation rather than being skipped.

# Pinned deliberately: maven() has no version ranges, so "latest stable" cannot
# express "newest 1.x". org.scala-sbt:sbt now resolves to 2.x.
sbt_version=1.12.14
sbtNativePackager_version=maven(com.github.sbt,sbt-native-packager_2.12_1.0,stable)
scalafmt_version=maven(org.scalameta,sbt-scalafmt_2.12_1.0,stable)

cats_version=maven(org.typelevel,cats-core_3,stable)
catsEffect_version=maven(org.typelevel,cats-effect_3,stable)
iron_version=maven(io.github.iltotore,iron-scalacheck_3,stable)
kitten_version=maven(org.typelevel,kittens_3,stable)
monocle_version=maven(dev.optics,monocle-core_3,stable)
scalacheck_version=maven(org.scalacheck,scalacheck_3,stable)
weaver_version=maven(com.disneystreaming,weaver-cats_3,stable)
squants_version = maven(org.typelevel,squants_3,stable)
http4s_version =maven(org.http4s,http4s-core_3,stable)
log4cat_version = maven(org.typelevel,log4cats-core_3,stable)
chimney_version = maven(io.scalaland,chimney_3,stable)
circe_version = maven(io.circe,circe-core_3,stable)
ciris_version = maven(is.cir,ciris_3,stable)
# Pinned deliberately: keeps generated projects on the Scala 3 LTS line.
scala_version= 3.3.6
skunk_version= maven(org.tpolecat,skunk-core_3,stable)
scalajs_version = maven(org.scala-js,sbt-scalajs_2.12_1.0,stable)
scalajs_cross_version = maven(org.portable-scala,sbt-scalajs-crossproject_2.12_1.0,stable)
laminar_version = maven(com.raquo,laminar_sjs1_3,stable)
